<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Server Yearbook</title>
    <!-- Import gentle rounded font (Quicksand) from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #ffe5ec;       /* True soft pastel pink background */
            --card-bg: #ffffff;        /* Pure white cards */
            --text-color: #4a2c3a;     /* Deep berry/rose brown for high readability */
            --text-muted: #9c6b80;     /* Muted rose for quotes and subtitles */
            --accent-color: #ff85a1;   /* Pastel pink accent */
            --accent-strong: #ff4d6d;  /* Deep pink for badges, counters, and highlights */
            --border-color: #ffc2d1;   /* Soft pink borders */
            --header-bg: linear-gradient(135deg, #ffc2d1, #ffe5ec);
            --img-bg: #fff0f3;         /* Soft background for contained images */
        }

        /* Dark Mode Palette */
        [data-theme="dark"] {
            --bg-color: #1a1215;       /* Deep dark espresso/berry */
            --card-bg: #261a1f;        /* Dark rose-tinted card background */
            --text-color: #ffe5ec;     /* Crisp pastel pink text */
            --text-muted: #c98a9d;     /* Soft rose muted text */
            --accent-color: #ff85a1;   /* Keep signature pastel pink */
            --accent-strong: #ff4d6d;  /* Keep vibrant pink */
            --border-color: #402832;   /* Subtle dark rose border */
            --header-bg: linear-gradient(135deg, #261a1f, #1a1215);
            --img-bg: #1a1215;         /* Dark background behind images */
        }

        body {
            font-family: 'Quicksand', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: relative;
            text-align: center;
            padding: 50px 20px;
            background: var(--header-bg);
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.1);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--accent-strong);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
            font-family: 'Quicksand', sans-serif;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-strong);
            transform: scale(1.05);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Category Section Styling */
        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 1.8rem;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-strong);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Category Counter Badge */
        .category-counter {
            background-color: var(--accent-strong);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(255, 77, 109, 0.3);
        }

        /* Submissions Grid */
        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .submission-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        .submission-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.25);
            border-color: var(--accent-strong);
        }

        /* Circular profile picture frames */
        .submission-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 3px solid var(--accent-strong);
            padding: 2px;
            background-color: var(--img-bg);
        }

        .submission-card h3 {
            margin: 0 0 6px 0;
            font-size: 1.35rem;
            color: var(--text-color);
            font-weight: 700;
        }

        /* Small role/category pill badge under the username */
        .role-badge {
            display: inline-block;
            background-color: #ffe0e9;
            color: var(--accent-strong);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        /* Gentle soft quote bubble box */
        .quote-box {
            background-color: rgba(255, 229, 236, 0.3);
            border: 1.5px dashed var(--border-color);
            border-radius: 16px;
            padding: 12px;
        }

        [data-theme="dark"] .quote-box {
            background-color: rgba(255, 133, 161, 0.05);
        }

        .submission-card p {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-word;
            margin: 0;
        }

        /* Server Moments Section */
        #server-moments {
            text-align: center;
            padding: 60px 20px 20px 20px;
            border-top: 3px solid var(--border-color);
            margin-top: 60px;
        }

        #server-moments h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--accent-strong);
            font-weight: 700;
        }

        #server-moments p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Masonry Grid Layout for Server Moments */
        .moments-grid {
            column-count: 3;
            column-gap: 20px;
        }

        @media (max-width: 900px) {
            .moments-grid { column-count: 2; }
        }
        @media (max-width: 600px) {
            .moments-grid { column-count: 1; }
        }

        .moment-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: var(--img-bg);
        }

        .moment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.25);
            border-color: var(--accent-strong);
        }

        .moment-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: unset;
        }
    </style>
</head>
<body>

    <header>
        <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle theme">🌙 Dark Mode</button>
        <h1>📖 GG Server Yearbook</h1>
        <p>Celebrating our community members, hierarchy ranks, and unforgettable moments.</p>
    </header>

    <div class="container">
        <!-- Dynamic Category Sections will render here -->
        <div id="categories-container">
            <p style="text-align: center; color: var(--text-muted);">Loading yearbook entries...</p>
        </div>

        <!-- Server Moments Section -->
        <section id="server-moments">
            <h2>Server Moments</h2>
            <p>Captured memories and highlights from our community!</p>
            
            <div class="moments-grid">
                <div class="moment-card">
                    <img src="images/moment1.png" alt="Server Moment 1">
                </div>
                <div class="moment-card">
                    <img src="images/moment2.png" alt="Server Moment 2">
                </div>
                <div class="moment-card">
                    <img src="images/moment3.png" alt="Server Moment 3">
                </div>
                <div class="moment-card">
                    <img src="images/moment4.png" alt="Server Moment 4">
                </div>
                <div class="moment-card">
                    <img src="images/moment5.png" alt="Server Moment 5">
                </div>
                <div class="moment-card">
                    <img src="images/moment6.png" alt="Server Moment 6">
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- Dark / Light Mode Logic ---
        const themeBtn = document.getElementById('theme-btn');
        const currentTheme = localStorage.getItem('yearbook-theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Light Mode';
        }

        themeBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('yearbook-theme', 'light');
                themeBtn.textContent = '🌙 Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('yearbook-theme', 'dark');
                themeBtn.textContent = '☀️ Light Mode';
            }
        });

        // --- Supabase & Rendering Logic ---
        const SUPABASE_URL = "https://ziwnnlhyywqolrblpxua.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppd25ubGh5eXdxb2xyYmxweHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjM2MzgsImV4cCI6MjEwMDQ5OTYzOH0.xILvd5omkFaUbk6sEBvt3eaXEMeAkMt8_TRXu2Ig0co";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ROLE_HIERARCHY = [
            "Owner", "Admin", "Server Manager", "Senior Moderator", "Department Manager",
            "Event Department", "Moderator", "Junior Moderator", "Contributor", "Alumni Staff",
            "Legend", "Elite", "Grand Winner", "YouTube Member", "Sever Booster",
            "🏆  Event Winner", "🏆  Question of the Day Winner", "Veteran", "Regular", "Active"
        ];

        async function fetchAndRenderYearbook() {
            const container = document.getElementById("categories-container");
            
            const { data, error } = await supabaseClient
                .from("submissions")
                .select("*");

            if (error) {
                console.error("Error fetching submissions:", error);
                container.innerHTML = `<p style="color: #ef4444; text-align: center;">Failed to load yearbook entries.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No yearbook entries submitted yet!</p>`;
                return;
            }

            // Group entries by category based on your role hierarchy order
            const groupedEntries = {};
            ROLE_HIERARCHY.forEach(role => {
                groupedEntries[role] = [];
            });
            
            // Fallback bucket for any uncategorized roles
            groupedEntries["Active"] = groupedEntries["Active"] || [];

            data.forEach(entry => {
                const cat = entry.category || "Active";
                if (!groupedEntries[cat]) {
                    groupedEntries[cat] = [];
                }
                groupedEntries[cat].push(entry);
            });

            container.innerHTML = "";

            // Render category sections in order of hierarchy
            ROLE_HIERARCHY.forEach(role => {
                const entries = groupedEntries[role];
                if (entries && entries.length > 0) {
                    const section = document.createElement("div");
                    section.className = "category-section";

                    let cardsHtml = "";
                    entries.forEach(entry => {
                        cardsHtml += `
                            <div class="submission-card">
                                <img src="${entry.image_url || 'https://via.placeholder.com/100'}" alt="${entry.username}'s avatar">
                                <h3>${entry.username}</h3>
                                <div class="role-badge">${role.toUpperCase()}</div>
                                <div class="quote-box">
                                    <p>"${entry.quote}"</p>
                                </div>
                            </div>
                        `;
                    });

                    section.innerHTML = `
                        <div class="category-title">
                            ${role} <span class="category-counter">${entries.length}</span>
                        </div>
                        <div class="submissions-grid">
                            ${cardsHtml}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        }

        fetchAndRenderYearbook();
    </script>
</body>
</html>
