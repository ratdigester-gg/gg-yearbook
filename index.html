<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Server Yearbook</title>
    <style>
        :root {
            --bg-primary: #fdf6f8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #fce4ec;
            --text-primary: #5a3e49;
            --text-muted: #9c7885;
            --accent: #f48fb1;
            --accent-hover: #f06292;
            --danger: #e57373;
            --danger-hover: #ef5350;
            --card-border: #f8bbd0;
            --shadow: 0 8px 24px rgba(244, 143, 177, 0.15);
            --hover-shadow: 0 16px 32px rgba(240, 98, 146, 0.28);
        }

        [data-theme="dark"] {
            --bg-primary: #2d2226;
            --bg-secondary: #382b30;
            --bg-tertiary: #4a3840;
            --text-primary: #fce4ec;
            --text-muted: #d8b0c0;
            --accent: #f48fb1;
            --accent-hover: #f06292;
            --danger: #e57373;
            --danger-hover: #ef5350;
            --card-border: rgba(244, 143, 177, 0.2);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --hover-shadow: 0 16px 32px rgba(244, 143, 177, 0.25);
        }

        * { 
            box-sizing: border-box; 
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-hover);
            font-size: 2.75rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0 0 30px 0;
        }

        .controls-panel {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto 40px auto;
            border: 1.5px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .controls-panel:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 28px rgba(244, 143, 177, 0.22);
        }

        .search-input {
            background: var(--bg-tertiary);
            border: 1.5px solid transparent;
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            flex: 1;
            min-width: 200px;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { 
            border-color: var(--accent-hover); 
            background-color: var(--bg-secondary);
        }

        .btn {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, color 0.25s ease;
        }

        .btn:hover { 
            background: var(--accent); 
            color: #fff; 
            transform: translateY(-2px) scale(1.03);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
        }

        .role-section {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            text-align: left;
        }

        .role-title {
            color: var(--accent-hover);
            font-size: 1.6rem;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-secondary);
            padding: 28px 20px 24px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            border: 1.5px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
            text-align: center;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        box-shadow 0.35s ease, 
                        border-color 0.35s ease;
            will-change: transform;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-hover);
            box-shadow: var(--hover-shadow);
        }

        .card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent);
            box-shadow: 0 6px 16px rgba(244, 143, 177, 0.3);
            background-color: var(--bg-tertiary);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        border-color 0.35s ease, 
                        box-shadow 0.35s ease;
        }

        .card:hover img {
            transform: scale(1.08) rotate(2deg);
            border-color: var(--accent-hover);
            box-shadow: 0 10px 24px rgba(240, 98, 146, 0.45);
        }

        .name {
            font-weight: 700;
            font-size: 1.25rem;
            margin: 18px 0 2px 0;
            color: var(--accent-hover);
            transition: color 0.25s ease;
        }

        .role-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            transition: color 0.25s ease;
        }

        .card:hover .role-badge {
            color: var(--accent);
        }

        .quote {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            transition: color 0.25s ease, transform 0.3s ease;
        }

        .card:hover .quote {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>GG Server Yearbook</h1>
    <p class="subtitle">Memories, quotes, and chaos from our server!</p>

    <div class="controls-panel">
        <input type="text" id="search-bar" class="search-input" placeholder="Search member or quote..." oninput="filterYearbook()">
        <button class="btn" id="toggle-theme" onclick="toggleTheme()">Light/Dark Mode</button>
    </div>

    <div id="yearbook-sections"></div>

    <script>
        let yearbookData = [];

        // Updated 20-tier hierarchy order
        // Updated 20-tier hierarchy order
const ROLE_ORDER = [
    "Owner",
    "Admin",
    "Server Manager",
    "Senior Moderator",
    "Department Manager",
    "Event Department", // <-- Above Moderator
    "Moderator",
    "Junior Moderator",
    "Contributor",
    "Alumni Staff",
    "Legend",
    "Elite",
    "Grand Winner",
    "YouTube Member",
    "Sever Booster",
    "🏆  Event Winner",
    "🏆  Question of the Day Winner",
    "Veteran",
    "Regular",
    "Active"
];
        fetch('https://raw.githubusercontent.com/ratdigester-gg/gg-yearbook/main/yearbook.json?' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                yearbookData = Array.isArray(data) ? data : (data.submissions || []);
                renderGroupedCards(yearbookData);
            })
            .catch(err => {
                console.error("Error loading yearbook data:", err);
                document.getElementById('yearbook-sections').innerHTML = `<p style='color: var(--text-muted);'>Failed to load yearbook entries.</p>`;
            });

        function renderGroupedCards(data) {
            const container = document.getElementById('yearbook-sections');
            if (!data.length) {
                container.innerHTML = "<p style='color: var(--text-muted);'>No submissions found!</p>";
                return;
            }

            const groups = {};
            data.forEach(item => {
                const role = item.category || item.role || "Active";
                if (!groups[role]) groups[role] = [];
                groups[role].push(item);
            });

            // Sort category headers based on ROLE_ORDER hierarchy
            const sortedRoles = Object.keys(groups).sort((a, b) => {
                let idxA = ROLE_ORDER.indexOf(a);
                let idxB = ROLE_ORDER.indexOf(b);
                if (idxA === -1) idxA = 999;
                if (idxB === -1) idxB = 999;
                return idxA - idxB;
            });

            container.innerHTML = sortedRoles.map(role => {
                // Formatting clean section headers (avoiding awkward double 's' suffixes)
                let sectionTitle = role;
                if (!role.endsWith('s') && !role.startsWith('🏆')) {
                    sectionTitle = `${role}s`;
                }

                return `
                <div class="role-section">
                    <h2 class="role-title">${sectionTitle}</h2>
                    <div class="grid">
                        ${groups[role].map((s, i) => {
                            const userRole = s.category || s.role || 'Active';
                            return `
                            <div class="card" id="card-${role.replace(/\s+/g, '-')}-${i}">
                                <img src="${s.image_path}" alt="${s.username}" onerror="this.onerror=null; this.src='https://cdn.discordapp.com/embed/avatars/0.png';">
                                <div class="name">@${s.username || 'Anonymous'}</div>
                                <div class="role-badge">${userRole}</div>
                                <div class="quote">"${s.quote || ''}"</div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterYearbook() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            const filtered = yearbookData.filter(s => {
                const username = (s.username || '').toLowerCase();
                const quote = (s.quote || '').toLowerCase();
                const role = (s.category || s.role || '').toLowerCase();
                return username.includes(query) || quote.includes(query) || role.includes(query);
            });
            renderGroupedCards(filtered);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
