<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Server Yearbook</title>
    <!-- Nunito matches the soft, rounded geometric font from your screenshot -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fff0f3;       /* Very soft pink background */
            --card-bg: #ffffff;        /* Pure white cards */
            --text-color: #38252e;     /* Deep soft berry text */
            --text-muted: #806873;     /* Muted neutral rose */
            --accent-color: #ffb3c6;   /* Light soft pink border */
            --accent-strong: #ff4d6d;  /* Darker pink accent */
            --border-color: #ffe0e6;   /* Subtle divider lines */
            --badge-bg: #ffe0e6;       /* Soft pink pill badge */
            --badge-text: #ff4d6d;
        }

        /* Dark Mode Palette */
        [data-theme="dark"] {
            --bg-color: #1a1215;
            --card-bg: #261a1f;
            --text-color: #ffe5ec;
            --text-muted: #c98a9d;
            --accent-color: #402832;
            --accent-strong: #ff85a1;
            --border-color: #402832;
            --badge-bg: #402832;
            --badge-text: #ff85a1;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: relative;
            text-align: center;
            padding: 40px 20px;
            background: transparent;
        }

        header h1 {
            font-size: 2.4rem;
            margin: 0 0 8px 0;
            color: var(--text-color);
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        header h1 span {
            color: #ff6b8b;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            font-family: 'Nunito', sans-serif;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.03);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Category Section Styling */
        .category-section {
            margin-bottom: 45px;
        }

        .category-title {
            font-size: 1.8rem;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
            color: var(--text-color);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Category Counter Badge matching reference image */
        .category-counter {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.9rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
        }

        /* Submissions Grid */
        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .submission-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(255, 133, 161, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submission-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 133, 161, 0.15);
        }

        /* Profile image matching reference */
        .submission-card img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 3px solid #ff6b8b;
        }

        .submission-card h3 {
            margin: 0 0 6px 0;
            font-size: 1.3rem;
            color: var(--text-color);
            font-weight: 800;
        }

        /* Small role pill badge */
        .role-badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Plain quote styling without dotted outline */
        .submission-card p {
            color: var(--text-muted);
            font-style: italic;
            font-size: 1rem;
            font-weight: 600;
            word-break: break-word;
            margin: 0;
            line-height: 1.4;
        }

        /* Server Moments Section */
        #server-moments {
            text-align: center;
            padding: 50px 20px 20px 20px;
            border-top: 1.5px solid var(--border-color);
            margin-top: 50px;
        }

        #server-moments h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 800;
        }

        #server-moments p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Masonry Grid Layout for Server Moments */
        .moments-grid {
            column-count: 3;
            column-gap: 20px;
        }

        @media (max-width: 900px) {
            .moments-grid { column-count: 2; }
        }
        @media (max-width: 600px) {
            .moments-grid { column-count: 1; }
        }

        .moment-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1.5px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.08);
            transition: transform 0.2s ease;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .moment-card:hover {
            transform: translateY(-3px);
        }

        .moment-card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle theme">🌙 Dark Mode</button>
        <h1>📖 Gohar's Guide Server <span>Yearbook 2026</span></h1>
        <p>Celebrating our community members and unforgettable moments.</p>
    </header>

    <div class="container">
        <!-- Dynamic Category Sections will render here -->
        <div id="categories-container">
            <p style="text-align: center; color: var(--text-muted);">Loading yearbook entries...</p>
        </div>

        <!-- Server Moments Section -->
        <section id="server-moments">
            <h2>Server Moments</h2>
            <p>Captured memories and highlights from our community!</p>
            
            <div class="moments-grid">
                <div class="moment-card">
                    <img src="images/moment1.png" alt="Server Moment 1">
                </div>
                <div class="moment-card">
                    <img src="images/moment2.png" alt="Server Moment 2">
                </div>
                <div class="moment-card">
                    <img src="images/moment3.png" alt="Server Moment 3">
                </div>
                <div class="moment-card">
                    <img src="images/moment4.png" alt="Server Moment 4">
                </div>
                <div class="moment-card">
                    <img src="images/moment5.png" alt="Server Moment 5">
                </div>
                <div class="moment-card">
                    <img src="images/moment6.png" alt="Server Moment 6">
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- Dark / Light Mode Logic ---
        const themeBtn = document.getElementById('theme-btn');
        const currentTheme = localStorage.getItem('yearbook-theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Light Mode';
        }

        themeBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('yearbook-theme', 'light');
                themeBtn.textContent = '🌙 Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('yearbook-theme', 'dark');
                themeBtn.textContent = '☀️ Light Mode';
            }
        });

        // --- Supabase & Rendering Logic ---
        const SUPABASE_URL = "https://ziwnnlhyywqolrblpxua.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppd25ubGh5eXdxb2xyYmxweHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjM2MzgsImV4cCI6MjEwMDQ5OTYzOH0.xILvd5omkFaUbk6sEBvt3eaXEMeAkMt8_TRXu2Ig0co";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ROLE_HIERARCHY = [
            "Owner", "Admin", "Server Manager", "Senior Moderator", "Department Manager",
            "Event Department", "Moderator", "Junior Moderator", "Contributor", "Alumni Staff",
            "Legend", "Elite", "Grand Winner", "YouTube Member", "Sever Booster",
            "🏆  Event Winner", "🏆  Question of the Day Winner", "Veteran", "Regular", "Active"
        ];

        async function fetchAndRenderYearbook() {
            const container = document.getElementById("categories-container");
            
            const { data, error } = await supabaseClient
                .from("submissions")
                .select("*");

            if (error) {
                console.error("Error fetching submissions:", error);
                container.innerHTML = `<p style="color: #ef4444; text-align: center;">Failed to load yearbook entries.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No yearbook entries submitted yet!</p>`;
                return;
            }

            // Group entries by category based on your role hierarchy order
            const groupedEntries = {};
            ROLE_HIERARCHY.forEach(role => {
                groupedEntries[role] = [];
            });
            
            // Fallback bucket for any uncategorized roles
            groupedEntries["Active"] = groupedEntries["Active"] || [];

            data.forEach(entry => {
                const cat = entry.category || "Active";
                if (!groupedEntries[cat]) {
                    groupedEntries[cat] = [];
                }
                groupedEntries[cat].push(entry);
            });

            container.innerHTML = "";

            // Render category sections in order of hierarchy
            ROLE_HIERARCHY.forEach(role => {
                const entries = groupedEntries[role];
                if (entries && entries.length > 0) {
                    const section = document.createElement("div");
                    section.className = "category-section";

                    let cardsHtml = "";
                    entries.forEach(entry => {
                        cardsHtml += `
                            <div class="submission-card">
                                <img src="${entry.image_url || 'https://via.placeholder.com/100'}" alt="${entry.username}'s avatar">
                                <h3>${entry.username}</h3>
                                <div class="role-badge">${role}</div>
                                <p>"${entry.quote}"</p>
                            </div>
                        `;
                    });

                    section.innerHTML = `
                        <div class="category-title">
                            ${role} <span class="category-counter">${entries.length}</span>
                        </div>
                        <div class="submissions-grid">
                            ${cardsHtml}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        }

        fetchAndRenderYearbook();
    </script>
</body>
</html>
