<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Server Yearbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #fff0f5;
      --card-bg: #ffffff;
      --card-border: #ffd1dc;
      --text-main: #4a3b4c;
      --text-muted: #8c7590;
      --accent-color: #ff69b4;
      --accent-hover: #ff1493;
      --badge-bg: #ffe4e1;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 240, 245, 0.85);
      --shadow: 0 8px 24px rgba(255, 105, 180, 0.12);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-color: #1a1518;
      --card-bg: #261f24;
      --card-border: #3d2e37;
      --text-main: #ffe6f0;
      --text-muted: #b39ab0;
      --accent-color: #ff69b4;
      --accent-hover: #ff8da1;
      --badge-bg: #362831;
      --input-bg: #1f181d;
      --header-bg: rgba(26, 21, 24, 0.85);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; transition: background-color 0.3s ease; padding-bottom: 4rem; }

    header { position: sticky; top: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 1rem 2rem; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .logo-area h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--text-main), var(--accent-color)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .controls { display: flex; align-items: center; gap: 1rem; flex-grow: 1; max-width: 500px; justify-content: flex-end; }
    .search-box { position: relative; flex-grow: 1; }
    .search-box input { width: 100%; padding: 0.65rem 1rem 0.65rem 2.5rem; border-radius: 9999px; border: 1px solid var(--card-border); background-color: var(--input-bg); color: var(--text-main); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .search-box input:focus { border-color: var(--accent-color); }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.65rem; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; transition: var(--transition); }
    .theme-toggle:hover { border-color: var(--accent-color); }

    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .role-section { margin-bottom: 3.5rem; }
    .role-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--card-border); display: flex; align-items: center; gap: 0.5rem; }
    .role-count { font-size: 0.8rem; background: var(--badge-bg); color: var(--accent-color); padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 600; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--shadow); transition: var(--transition); }
    .card:hover { transform: translateY(-6px); border-color: var(--accent-color); }

    .avatar-wrapper { position: relative; margin-bottom: 1rem; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); background-color: var(--badge-bg); }
    .username { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; word-break: break-word; }
    .badge { font-size: 0.75rem; font-weight: 600; background-color: var(--badge-bg); color: var(--accent-color); padding: 0.25rem 0.75rem; border-radius: 9999px; margin-bottom: 1rem; text-transform: uppercase; }
    
    .quote-box { background: rgba(255, 105, 180, 0.05); border-radius: 12px; padding: 0.85rem; width: 100%; flex-grow: 1; border: 1px dashed var(--card-border); display: flex; align-items: center; justify-content: center; }
    .quote { font-size: 0.9rem; color: var(--text-muted); font-style: italic; line-height: 1.4; word-break: break-word; }

    .status-message { text-align: center; padding: 4rem 1rem; font-size: 1.1rem; color: var(--text-muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="header-container">
      <div class="logo-area"><h1>📖 GG Server Yearbook</h1></div>
      <div class="controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search by username or quote...">
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme"><span id="themeIcon">🌙</span></button>
      </div>
    </div>
  </header>

  <main id="yearbookContainer">
    <div class="status-message" id="loadingState">⏳ Loading live yearbook entries...</div>
    <div class="status-message hidden" id="emptyState">No yearbook entries found matching your search.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // --- SUPABASE FRONTEND CONFIGURATION ---
    const SUPABASE_URL = 'https://ziwnnlhyywqolrblpxua.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppd25ubGh5eXdxb2xyYmxweHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjM2MzgsImV4cCI6MjEwMDQ5OTYzOH0.xILvd5omkFaUbk6sEBvt3eaXEMeAkMt8_TRXu2Ig0co';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROLE_HIERARCHY = [
      "Owner", "Admin", "Server Manager", "Senior Moderator", "Department Manager",
      "Event Department", "Moderator", "Junior Moderator", "Contributor", "Alumni Staff",
      "Legend", "Elite", "Grand Winner", "YouTube Member", "Sever Booster",
      "🏆  Event Winner", "🏆  Question of the Day Winner", "Veteran", "Regular", "Active"
    ];

    let allSubmissions = [];

    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const body = document.body;

    const savedTheme = localStorage.getItem('gg_yearbook_theme') || 'light';
    body.setAttribute('data-theme', savedTheme);
    themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('gg_yearbook_theme', newTheme);
      themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    async function fetchYearbookData() {
      const { data, error } = await supabaseClient.from('submissions').select('*');
      document.getElementById('loadingState').classList.add('hidden');

      if (error) {
        console.error("Error fetching yearbook:", error);
        return;
      }

      if (data) {
        allSubmissions = data;
        renderYearbook(allSubmissions);
      }
    }

    supabaseClient
      .channel('live-yearbook-feed')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, () => {
        fetchYearbookData();
      })
      .subscribe();

    function renderYearbook(submissions) {
      const container = document.getElementById('yearbookContainer');
      const emptyState = document.getElementById('emptyState');
      
      container.querySelectorAll('.role-section').forEach(el => el.remove());

      if (submissions.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      const grouped = {};
      submissions.forEach(entry => {
        const cat = entry.category || "Active";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(entry);
      });

      const sortedCategories = Object.keys(grouped).sort((a, b) => {
        const indexA = ROLE_HIERARCHY.indexOf(a);
        const indexB = ROLE_HIERARCHY.indexOf(b);
        return (indexA === -1 ? 999 : indexA) - (indexB === -1 ? 999 : indexB);
      });

      sortedCategories.forEach(role => {
        const members = grouped[role];
        const section = document.createElement('section');
        section.className = 'role-section';

        const title = document.createElement('h2');
        title.className = 'role-title';
        title.innerHTML = `${role} <span class="role-count">${members.length}</span>`;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        members.forEach(member => {
          const card = document.createElement('div');
          card.className = 'card';
          card.setAttribute('data-username', member.username.toLowerCase());
          card.setAttribute('data-quote', (member.quote || '').toLowerCase());

          const avatarUrl = member.image_url || 'https://cdn.discordapp.com/embed/avatars/0.png';

          card.innerHTML = `
            <div class="avatar-wrapper">
              <img src="${avatarUrl}" alt="${member.username}" class="avatar" loading="lazy" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            </div>
            <div class="username">${escapeHTML(member.username)}</div>
            <div class="badge">${escapeHTML(role)}</div>
            <div class="quote-box">
              <p class="quote">"${escapeHTML(member.quote || 'No quote provided.')}"</p>
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      let visibleCount = 0;

      document.querySelectorAll('.card').forEach(card => {
        const match = card.getAttribute('data-username').includes(query) || card.getAttribute('data-quote').includes(query);
        card.classList.toggle('hidden', !match);
        if (match) visibleCount++;
      });

      document.querySelectorAll('.role-section').forEach(section => {
        const visibleCards = section.querySelectorAll('.card:not(.hidden)').length;
        section.classList.toggle('hidden', visibleCards === 0);
      });

      document.getElementById('emptyState').classList.toggle('hidden', visibleCount > 0 || allSubmissions.length === 0);
    });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    fetchYearbookData();
  </script>
</body>
</html>
