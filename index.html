<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Server Yearbook</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Yearbook Submissions Grid */
        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .submission-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .submission-card:hover {
            transform: translateY(-5px);
        }

        .submission-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #3b82f6;
        }

        .submission-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .submission-card .category-badge {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submission-card p {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
            word-break: break-word;
        }

        /* Server Moments Section */
        #server-moments {
            text-align: center;
            padding: 50px 20px;
            border-top: 2px solid var(--border-color);
            margin-top: 40px;
        }

        #server-moments h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #server-moments p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .moments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .moment-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .moment-card:hover {
            transform: translateY(-5px);
        }

        .moment-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>GG Server Yearbook</h1>
        <p>A live archive of our community members, quotes, and highlights.</p>
    </header>

    <div class="container">
        <!-- Submissions will load dynamically here -->
        <div id="submissions-container" class="submissions-grid">
            <p style="text-align: center; color: var(--text-muted);">Loading entries...</p>
        </div>

        <!-- Server Moments Section -->
        <section id="server-moments">
            <h2>Server Moments</h2>
            <p>Captured memories and highlights from our community!</p>
            
            <div class="moments-grid">
                <div class="moment-card">
                    <img src="images/moment1.png" alt="Server Moment 1">
                </div>
                <div class="moment-card">
                    <img src="images/moment2.png" alt="Server Moment 2">
                </div>
                <div class="moment-card">
                    <img src="images/moment3.png" alt="Server Moment 3">
                </div>
            </div>
        </section>
    </div>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = "https://ziwnnlhyywqolrblpxua.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppd25ubGh5eXdxb2xyYmxweHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjM2MzgsImV4cCI6MjEwMDQ5OTYzOH0.xILvd5omkFaUbk6sEBvt3eaXEMeAkMt8_TRXu2Ig0co";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchSubmissions() {
            const container = document.getElementById("submissions-container");
            
            const { data, error } = await supabaseClient
                .from("submissions")
                .select("*");

            if (error) {
                console.error("Error fetching submissions:", error);
                container.innerHTML = `<p style="color: #ef4444; text-align: center;">Failed to load yearbook entries.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No yearbook entries submitted yet!</p>`;
                return;
            }

            container.innerHTML = "";
            data.forEach(entry => {
                const card = document.createElement("div");
                card.className = "submission-card";
                card.innerHTML = `
                    <img src="${entry.image_url || 'https://via.placeholder.com/80'}" alt="${entry.username}'s avatar">
                    <h3>${entry.username}</h3>
                    <span class="category-badge">${entry.category}</span>
                    <p>"${entry.quote}"</p>
                `;
                container.appendChild(card);
            });
        }

        fetchSubmissions();
    </script>
</body>
</html>
